<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Furkan Kundura</title>
  <style>
    /* 1. Temel Sayfa Ayarları */
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1e24;
      color: white;
      margin: 0;
      padding: 20px;
    }

    /* 2. Üst Menü (Navbar) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #121519;
      padding: 15px 20px;
      border-radius: 8px;
    }

    .logo {
      color: #f36c21;
      font-size: 20px;
      font-weight: bold;
    }

    /* Sadece Görsel Olan Menü Linkleri */
    .nav-links span {
      margin: 0 12px;
      font-size: 13px;
      font-weight: bold;
      color: #ccc;
      cursor: pointer;
    }

    .nav-links .discount {
      color: #f36c21;
    }

    /* Sağ Taraf (Arama ve Sepet) */
    .right-menu {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .search-input {
      background-color: #262b33;
      border: 1px solid #3a414d;
      color: white;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 12px;
      width: 100px;
    }

    .cart {
      background-color: #f36c21;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
    }

    /* 3. Ürün Kartları Kutusu */
    .product-container {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }

    /* 4. Tekli Ürün Kartı */
    .card {
      background-color: #21262d;
      border: 1px solid #353b45;
      border-radius: 8px;
      padding: 15px;
      width: 200px;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 5px;
    }

    .price {
      color: #f36c21;
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      background-color: #f36c21;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Üst Menü -->
  <header>
    <div class="logo">FURKAN KUNDURA</div>

    <!-- Görsel Kategori Linkleri  -->
    <div class="nav-links">
      <span>YENİ GELENLER</span>
      <span>KADIN</span>
      <span>ERKEK</span>
      <span>SPOR</span>
      <span class="discount">İNDİRİM</span>
    </div>

    <!-- Sağ Taraf (Arama Kutusu + Sepet) -->
    <div class="right-menu">
      <input type="text" class="search-input" placeholder="Arama...">
      <div class="cart">Sepet: <span id="count">0</span></div>
    </div>
  </header>

  <!-- Ürün Listesi -->
  <h2>Öne Çıkan Ayakkabılar</h2>
  <div class="product-container">
    
    <!-- Ürün 1 -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" alt="Ayakkabı">
      <h3>Spor Sneaker</h3>
      <p class="price">2.499 TL</p>
      <button onclick="ekle()">Sepete Ekle</button>
    </div>

    <!-- Ürün 2 -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=300" alt="Ayakkabı">
      <h3>Casual Siyah</h3>
      <p class="price">1.999 TL</p>
      <button onclick="ekle()">Sepete Ekle</button>
    </div>

    <!-- Ürün 3 (Stokta Yok) -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=300" alt="Ayakkabı">
      <h3>Deri Bot</h3>
      <p class="price">2.999 TL</p>
      <button disabled>Stokta Yok</button>
    </div>

  </div>

  <!-- JavaScript (Sepet Mantığı) -->
  <script>
    let sepetSayisi = 0;

    function ekle() {
      sepetSayisi++;
      document.getElementById('count').textContent = sepetSayisi;
    }
  </script>

</body>
</html>
